name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A new push to the same PR or branch supersedes the run in flight. Without
  # this every push queued a *fresh* full set of jobs alongside the old ones,
  # so a branch pushed five times held five complete matrices at once — on
  # paid Blacksmith runners, and with nothing reclaiming the superseded work.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Capped because the GitHub default is **six hours** per job, and this
    # workflow is reachable from a fork pull request. Measured over the last
    # six runs the slowest job here is 3m57s, so 20 minutes is roughly 5x
    # headroom while removing the runaway: a stuck or hostile job now costs
    # 20 minutes of a paid runner rather than a working day of one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --features "bytecode,taylor,laurent,stde,serde,faer,nalgebra,ndarray,parallel,diffop"

      - name: Run tests (echidna with all features)
        run: cargo test -p echidna --features "bytecode,taylor,laurent,stde,serde,faer,nalgebra,ndarray,parallel,diffop"

      - name: Run tests (echidna-optim)
        run: cargo test -p echidna-optim

      - name: Run tests (echidna-optim with sparse-implicit)
        run: cargo test -p echidna-optim --features sparse-implicit

  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all non-CUDA features)
        run: cargo clippy --all-targets --features "bytecode,taylor,laurent,stde,serde,faer,nalgebra,ndarray,parallel,diffop,gpu-wgpu" -- -D warnings

      - name: Clippy (echidna-optim)
        run: cargo clippy --all-targets -p echidna-optim --all-features -- -D warnings


  docs:
    name: Documentation
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs (echidna)
        run: cargo doc --no-deps --features "bytecode,taylor,laurent,stde,serde,faer,nalgebra,ndarray,parallel,diffop,gpu-wgpu"
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Doc-tests (echidna, GPU examples compile-checked)
        run: cargo test --doc -p echidna --features "bytecode,taylor,laurent,stde,serde,faer,nalgebra,ndarray,parallel,diffop,gpu-wgpu"

      - name: Build docs (echidna-optim)
        run: cargo doc -p echidna-optim --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (1.93)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.93

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (default features)
        run: cargo build

      - name: Test (default features)
        run: cargo test

      - name: Build (bytecode)
        run: cargo build --features bytecode

      - name: Test (bytecode)
        run: cargo test --features bytecode

      - name: Build (taylor)
        run: cargo build --features taylor

      - name: Test (taylor)
        run: cargo test --features taylor

      - name: Build (stde)
        run: cargo build --features stde

      - name: Test (stde)
        run: cargo test --features stde

      - name: Build (bytecode,taylor)
        run: cargo build --features bytecode,taylor

      - name: Test (bytecode,taylor)
        run: cargo test --features bytecode,taylor

      - name: Build (bytecode,stde)
        run: cargo build --features bytecode,stde

      - name: Test (bytecode,stde)
        run: cargo test --features bytecode,stde

      - name: Build (taylor,stde)
        run: cargo build --features taylor,stde

      - name: Test (taylor,stde)
        run: cargo test --features taylor,stde

      - name: Build (bytecode,taylor,stde)
        run: cargo build --features bytecode,taylor,stde

      - name: Test (bytecode,taylor,stde)
        run: cargo test --features bytecode,taylor,stde

  coverage:
    name: Coverage
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --out xml --timeout 300 --features "bytecode,taylor,laurent,stde,serde,faer,nalgebra,ndarray,parallel"
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependency policies
        run: cargo deny check

